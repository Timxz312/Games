<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlockWorld 2 - Upgrade</title>
  <style>
    :root{
      --bg:#0d1218;
      --panel:#171f2a;
      --panel-2:#212d3d;
      --line:#7bc0ff;
      --text:#ebf6ff;
      --accent:#7ee081;
      --danger:#ff7070;
      --gold:#ffd76f;
      --shadow: rgba(0,0,0,.45);
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:var(--bg);font-family:system-ui,Segoe UI,sans-serif;color:var(--text);overflow:hidden}
    body{
      background: linear-gradient(180deg,#8dd7ff 0%, #bfe8ff 38%, #d7e9ff 100%);
    }
    canvas{
      display:block;
      width:100vw;
      height:100vh;
      image-rendering: pixelated;
    }

    #overlay{
      position:fixed;inset:0;pointer-events:none;
    }

    #hud{
      position:absolute;top:12px;left:12px;
      background:rgba(12,18,25,.52);
      border:2px solid rgba(255,255,255,.25);
      border-radius:12px;
      padding:10px 12px;
      min-width:260px;
      box-shadow:0 10px 25px var(--shadow);
      backdrop-filter: blur(4px);
    }
    #modeText{
      font-size:12px; letter-spacing:1px; text-transform:uppercase; color:#dff6ff; opacity:.85;
    }
    #stats{
      display:flex; gap:18px; align-items:center; margin-top:8px; font-weight:700;
    }
    .stat{display:flex;align-items:center;gap:6px}
    .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
    .dot.hp{background:#ff6f6f}
    .dot.food{background:#9ae38d}
    .dot.day{background:#ffd76f}

    #hotbar{
      position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
      display:flex;gap:8px;padding:8px 10px;border-radius:14px;
      background:rgba(12,18,25,.52);border:2px solid rgba(255,255,255,.18);
      box-shadow:0 12px 24px var(--shadow);
    }
    .slot{
      width:46px;height:46px;border-radius:8px;border:2px solid rgba(255,255,255,.18);
      background:linear-gradient(180deg,#40526a,#212d3d);position:relative;display:flex;align-items:center;justify-content:center;
      font-size:11px;font-weight:700; overflow:hidden; user-select:none;
    }
    .slot.selected{
      border-color:#ffd76f; box-shadow:0 0 0 2px rgba(255,215,111,.3);
      background:linear-gradient(180deg,#586d80,#243140);
    }
    .slot .icon{
      width:80%;height:80%;display:flex;align-items:center;justify-content:center;
      font-size:22px;position:relative;
    }
    .slot .count{
      position:absolute;right:4px;bottom:3px;font-size:10px;font-weight:800;
      background:rgba(0,0,0,.35);padding:1px 4px;border-radius:5px;
    }
    .slot.empty{
      opacity:.75;
      border-style:dashed;
    }

    #inventoryPanel{
      position:absolute;right:18px;top:18px;width:340px;max-height:76vh;
      background:rgba(11,18,26,.75);border:2px solid rgba(255,255,255,.18);
      border-radius:16px;padding:12px;display:none;backdrop-filter:blur(4px);
      box-shadow:0 15px 30px var(--shadow);
    }
    #inventoryPanel.open{display:block}
    #inventoryHeader{
      display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;
      font-weight:800;text-transform:uppercase;letter-spacing:1px;font-size:12px
    }
    #inventoryGrid{
      display:grid;grid-template-columns:repeat(5,1fr);gap:8px;
      max-height:46vh;overflow:auto;padding-right:4px;
    }
    .invItem{
      background:linear-gradient(180deg,#273245,#1a2430);border:2px solid rgba(255,255,255,.1);
      border-radius:10px;padding:8px 6px;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;cursor:pointer;position:relative;
    }
    .invItem .emoji{font-size:24px}
    .invItem .num{position:absolute;right:4px;bottom:4px;font-size:10px;background:rgba(0,0,0,.25);padding:1px 4px;border-radius:5px}
    .invItem.selected{border-color:var(--gold)}
    .invItem.empty{opacity:.35;border-style:dashed}
    #crafting{
      margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.15)
    }
    .recipe{
      display:flex;align-items:center;justify-content:space-between;
      gap:8px;padding:8px 10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;margin-top:8px;
      color:#eef7ff;font-size:13px;
    }
    .recipe button{
      background:var(--accent);color:#11210d;border:none;border-radius:8px;padding:6px 10px;font-weight:800;cursor:pointer;
    }
    #message{
      position:absolute;left:50%;top:18px;transform:translateX(-50%);
      background:rgba(14,20,28,.72);padding:8px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.15);
      box-shadow:0 8px 12px rgba(0,0,0,.28);font-weight:700;
      opacity:0;transition:opacity .2s ease;
      pointer-events:none;
    }
    #message.show{opacity:1}
    #titleScreen{
      position:fixed;inset:0;background:linear-gradient(180deg,rgba(17,26,38,.7),rgba(17,26,38,.88));
      display:flex;align-items:center;justify-content:center;z-index:20;
    }
    .menuBox{
      background:linear-gradient(180deg,#203147,#101a24);
      border:2px solid rgba(255,255,255,.18);
      box-shadow:0 20px 40px rgba(0,0,0,.45);
      border-radius:18px;padding:22px 22px 18px;
      width:min(92vw,540px);
    }
    .menuTitle{
      font-size:clamp(2rem,5vw,4rem);font-weight:900;letter-spacing:2px;text-align:center;
      text-shadow:0 4px 0 rgba(0,0,0,.25);
      margin:0 0 10px;
    }
    .menuSub{
      text-align:center; opacity:.78; margin-bottom:18px; font-size:14px;
    }
    .menuButtons{
      display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:16px;
    }
    button{
      border:none;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer;
      background:var(--accent);color:#102511;box-shadow:0 8px 20px rgba(126,224,129,.18);
    }
    .secondary{
      background:#2a394b;color:#edf6ff;box-shadow:none;
    }
    select{
      background:#1c2a38;color:#edf7ff;border:1px solid rgba(255,255,255,.15);
      border-radius:8px;padding:10px 12px;font-weight:700;
    }
    #crosshair{
      position:fixed;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);
      pointer-events:none;opacity:.85;
    }
    #crosshair:before, #crosshair:after{
      content:"";position:absolute;background:#fff;border-radius:2px;
    }
    #crosshair:before{left:8px;top:0;width:2px;height:18px}
    #crosshair:after{top:8px;left:0;width:18px;height:2px}
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="overlay">
    <div id="hud">
      <div id="modeText">Mode: Survival</div>
      <div id="stats">
        <div class="stat"><span class="dot hp"></span><span id="hpText">100 HP</span></div>
        <div class="stat"><span class="dot food"></span><span id="foodText">100</span></div>
        <div class="stat"><span class="dot day"></span><span id="timeText">Day</span></div>
      </div>
    </div>

    <div id="message">Message</div>

    <div id="hotbar"></div>

    <div id="inventoryPanel">
      <div id="inventoryHeader">
        <span>Inventory</span>
        <button class="secondary" id="closeInv">Close</button>
      </div>
      <div id="inventoryGrid"></div>

      <div id="crafting">
        <strong>Crafting</strong>
        <div id="recipeList"></div>
      </div>
    </div>

    <div id="crosshair"></div>
  </div>

  <div id="titleScreen">
    <div class="menuBox">
      <div class="menuTitle">BLOCKWORLD 2</div>
      <div class="menuSub">Mine, build, survive, craft and defeat mobs</div>

      <div style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;">
        <label style="display:flex;align-items:center;gap:8px;font-weight:700;">
          Mode:
          <select id="modeSelect">
            <option value="survival">Survival</option>
            <option value="creative">Creative</option>
            <option value="hardcore">Hardcore</option>
          </select>
        </label>
      </div>

      <div class="menuButtons">
        <button id="startBtn">Start</button>
        <button class="secondary" id="newWorldBtn">New World</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const hotbarEl = document.getElementById('hotbar');
    const inventoryPanel = document.getElementById('inventoryPanel');
    const inventoryGrid = document.getElementById('inventoryGrid');
    const recipeList = document.getElementById('recipeList');
    const messageEl = document.getElementById('message');
    const hpText = document.getElementById('hpText');
    const foodText = document.getElementById('foodText');
    const timeText = document.getElementById('timeText');
    const modeText = document.getElementById('modeText');
    const titleScreen = document.getElementById('titleScreen');
    const modeSelect = document.getElementById('modeSelect');

    const TILE = {
      0: {name:'Empty', color:null, solid:false, emoji:'', type:'air'},
      1: {name:'Grass', color:'#5cc852', solid:true, emoji:'🌿', type:'ground'},
      2: {name:'Dirt', color:'#8b5a2b', solid:true, emoji:'🟫', type:'ground'},
      3: {name:'Stone', color:'#7b7f88', solid:true, emoji:'🪨', type:'stone'},
      4: {name:'Wood', color:'#9d6f3b', solid:true, emoji:'🪵', type:'wood'},
      5: {name:'Leaves', color:'#4ea75a', solid:true, emoji:'🍃', type:'leaf'},
      6: {name:'Sand', color:'#d9c57d', solid:true, emoji:'🏖️', type:'sand'},
      7: {name:'Water', color:'#38a8f5', solid:false, emoji:'💧', type:'liquid'},
      8: {name:'Planks', color:'#c88c52', solid:true, emoji:'🪵', type:'wood'},
      9: {name:'Glass', color:'#bfeaff', solid:true, emoji:'🪟', type:'glass'},
      10:{name:'Brick', color:'#d76d4f', solid:true, emoji:'🧱', type:'brick'},
      11:{name:'Cobblestone', color:'#8e8d93', solid:true, emoji:'🪨', type:'stone'},
      12:{name:'Gravel', color:'#9a9a9a', solid:true, emoji:'🪨', type:'ground'},
      13:{name:'Snow', color:'#edf5ff', solid:true, emoji:'❄️', type:'snow'},
      14:{name:'Gold', color:'#f7d45c', solid:true, emoji:'🪙', type:'ore'},
      15:{name:'Coal', color:'#3a3d45', solid:true, emoji:'⚫', type:'ore'},
      16:{name:'Iron Ore', color:'#c7c7d1', solid:true, emoji:'⛓️', type:'ore'},
      17:{name:'Emerald', color:'#2eea6d', solid:true, emoji:'💎', type:'ore'},
      18:{name:'Diamond', color:'#6eddff', solid:true, emoji:'💎', type:'ore'},
      19:{name:'Obsidian', color:'#391a52', solid:true, emoji:'🕶️', type:'stone'},
      20:{name:'Portal', color:'#b77ef5', solid:false, emoji:'🌀', type:'portal'},
      21:{name:'Craft Table', color:'#d7a466', solid:true, emoji:'🛠️', type:'craft'},
      22:{name:'Torch', color:'#f9d388', solid:false, emoji:'🔥', type:'light'},
      23:{name:'Redstone', color:'#d83c3c', solid:true, emoji:'🔴', type:'ore'},
      24:{name:'Bedrock', color:'#1d1d1d', solid:true, emoji:'⬛', type:'stone'},
      25:{name:'Sandstone', color:'#d0b056', solid:true, emoji:'🟨', type:'sand'},
      26:{name:'Moss', color:'#5aa863', solid:true, emoji:'🌱', type:'ground'},
      27:{name:'Copper', color:'#ca7c57', solid:true, emoji:'🟠', type:'ore'},
      28:{name:'Lava', color:'#ff6b1d', solid:false, emoji:'🔥', type:'liquid'},
      29:{name:'Nether Brick', color:'#5f1f1a', solid:true, emoji:'🧱', type:'brick'},
      30:{name:'End Stone', color:'#d7d3b8', solid:true, emoji:'✨', type:'stone'},
      31:{name:'Glowstone', color:'#f9e7a2', solid:true, emoji:'🌟', type:'light'},
      32:{name:'Crystal', color:'#b476ff', solid:true, emoji:'🔷', type:'ore'}
    };

    const RECIPES = [
      {input:{8:1}, output:{9:1}, name:'Glass'},
      {input:{1:3}, output:{8:1}, name:'Planks'},
      {input:{8:2}, output:{21:1}, name:'Craft Table'},
      {input:{8:3, 3:1}, output:{10:2}, name:'Bricks'},
      {input:{3:3}, output:{11:4}, name:'Cobble'},
      {input:{10:2}, output:{25:2}, name:'Sandstone'},
      {input:{3:2, 15:1}, output:{22:1}, name:'Torch'},
      {input:{3:3, 14:1}, output:{17:1}, name:'Emerald'},
      {input:{3:4, 17:1}, output:{18:1}, name:'Diamond'},
      {input:{3:4, 16:1}, output:{32:1}, name:'Crystal'}
    ];

    const WORLD_COLS = 72;
    const WORLD_ROWS = 42;
    const TILE_SIZE = 22;
    const world = Array(WORLD_COLS * WORLD_ROWS).fill(0);

    const food = {value:100, max:100};
    const player = {
      x: 18,
      y: 10,
      w: 0.82,
      h: 1.18,
      vx: 0,
      vy: 0,
      speed: 4.2,
      jump: 9.3,
      onGround: false,
      hp: 100,
      maxHp: 100,
      dir: 1,
      inventory: {},
      hotbar: [],
      selected: 0,
      inventoryOpen: false,
      inMenu: true
    };

    const mobTypes = [
      {type:'slime', color:'#58d26d', hp:20, speed:0.75, emoji:'🟢'},
      {type:'zombie', color:'#6ea743', hp:30, speed:0.9, emoji:'🧟'},
      {type:'bat', color:'#a6a0ff', hp:14, speed:1.3, emoji:'🦇'},
      {type:'spider', color:'#5f4840', hp:26, speed:1.1, emoji:'🕷️'}
    ];
    let mobs = [];
    let particles = [];
    let weather = {rain:0, snow:0};
    let time = 0;
    let mode = 'survival';
    let worldSeed = 1;

    const settings = {
      gravity: 19,
      friction: 0.82,
      pointerLock: false
    };

    function rand(seed) {
      let x = Math.sin(seed) * 10000;
      return x - Math.floor(x);
    }

    function hash2D(x, y) {
      return rand(x * 127.1 + y * 311.7 + worldSeed * 7.1);
    }

    function getTile(x, y) {
      if (x < 0 || y < 0 || x >= WORLD_COLS || y >= WORLD_ROWS) return 0;
      return world[y * WORLD_COLS + x];
    }
    function setTile(x, y, id) {
      if (x < 0 || y < 0 || x >= WORLD_COLS || y >= WORLD_ROWS) return;
      world[y * WORLD_COLS + x] = id;
    }

    function clamp(v, min, max) {
      return Math.min(max, Math.max(min, v));
    }

    function addItem(id, amount=1) {
      if (!id || id === 0) return;
      player.inventory[id] = (player.inventory[id] || 0) + amount;
      for(let i=0;i<player.hotbar.length;i++){
        if(player.hotbar[i] === id){
          return;
        }
      }
      if(player.hotbar.length < 9){
        player.hotbar.push(id);
      }
    }

    function removeItem(id, amount=1) {
      if (!player.inventory[id]) return false;
      player.inventory[id] -= amount;
      if (player.inventory[id] <= 0) delete player.inventory[id];
      return true;
    }

    function stackFor(id){
      if (id === 7 || id === 20 || id === 22 || id === 28) return 16;
      if (id >= 14 && id <= 32) return 16;
      return 64;
    }

    function getSelectedItem() {
      const id = player.hotbar[player.selected];
      return id || 0;
    }

    function showMessage(msg, timeout=1400) {
      messageEl.textContent = msg;
      messageEl.classList.add('show');
      clearTimeout(showMessage.t);
      showMessage.t = setTimeout(() => messageEl.classList.remove('show'), timeout);
    }

    function makeInitialInventory() {
      const starter = {1: 18, 2: 12, 3: 12, 4: 4, 8: 2};
      player.inventory = {};
      for (const [id, amt] of Object.entries(starter)) {
        player.inventory[Number(id)] = amt;
      }
      player.hotbar = [1,2,3,8,4,9,21,14,0];
      player.selected = 0;
    }

    function surfaceHeight(x) {
      const seed = hash2D(x, 0);
      let h = 14 + Math.floor(seed * 10);
      if (x < 6 || x > WORLD_COLS - 7) h = 10;
      return h;
    }

    function generateWorld() {
      world.fill(0);
      for (let x = 0; x < WORLD_COLS; x++) {
        const h = surfaceHeight(x);
        for (let y = 0; y < WORLD_ROWS; y++) {
          if (y < h - 2) {
            setTile(x, y, 3);
            if (y > h - 4) setTile(x, y, 2);
          } else if (y < h) {
            setTile(x, y, 1);
          } else if (y < WORLD_ROWS - 3) {
            setTile(x, y, 7);
          }
        }
        for (let y = h - 2; y < h + 1; y++) {
          for (let xx = -1; xx <= 1; xx++) {
            const nx = x + xx;
            if (nx < 0 || nx >= WORLD_COLS) continue;
            if (Math.random() < 0.06) setTile(nx, y, 5);
          }
        }
      }

      for (let x = 5; x < WORLD_COLS - 5; x++) {
        const oreChance = hash2D(x, 11);
        if (oreChance > 0.76) {
          const yy = 5 + Math.floor(hash2D(x, 10) * 8);
          for (let y = yy; y < yy + 3; y++) {
            if (y >= 0 && y < WORLD_ROWS) setTile(x, y, 16);
          }
        }
        if (hash2D(x, 22) > 0.8) {
          const yy = 4 + Math.floor(hash2D(x, 33) * 7);
          for (let y = yy; y < yy + 2; y++) setTile(x, y, 14);
        }
      }

      const spawnX = Math.floor(WORLD_COLS / 2);
      const spawnY = 12;
      player.x = spawnX + 0.5;
      player.y = spawnY + 1.4;
      player.vx = 0; player.vy = 0;
      player.hp = player.maxHp;
      food.value = food.max;
    }

    function saveGame() {
      const data = {
        mode, time, worldSeed,
        player: {
          x: player.x,
          y: player.y,
          hp: player.hp,
          inventory: player.inventory,
          hotbar: player.hotbar,
          selected: player.selected
        },
        world: world.slice()
      };
      localStorage.setItem('blockworld2save', JSON.stringify(data));
    }

    function loadGame() {
      const raw = localStorage.getItem('blockworld2save');
      if (!raw) return false;
      try {
        const data = JSON.parse(raw);
        if (!data) return false;
        mode = data.mode || 'survival';
        time = data.time || 0;
        worldSeed = data.worldSeed || 1;
        if (Array.isArray(data.world)) {
          for (let i = 0; i < world.length; i++) world[i] = data.world[i];
        }
        if (data.player) {
          player.x = data.player.x ?? 20;
          player.y = data.player.y ?? 10;
          player.hp = data.player.hp ?? player.maxHp;
          player.inventory = data.player.inventory || {};
          player.hotbar = data.player.hotbar || [1,2,3,8,4,9,21,14,0];
          player.selected = data.player.selected ?? 0;
        }
        player.inMenu = false;
        return true;
      } catch (err) {
        console.warn('Save load failed', err);
        return false;
      }
    }

    function createMobs() {
      mobs = [];
      for (let i=0;i<10;i++){
        const type = mobTypes[Math.floor(Math.random()*mobTypes.length)];
        const x = 8 + Math.random() * (WORLD_COLS - 16);
        const y = 14 + Math.random() * 6;
        mobs.push({
          type:type.type,
          color:type.color,
          hp:type.hp,
          maxHp:type.hp,
          speed:type.speed,
          emoji:type.emoji,
          x, y,
          vx:0, vy:0,
          dir: Math.random() > 0.5 ? 1 : -1
        });
      }
    }

    function updateWeather() {
      const t = Math.sin(time * 0.5);
      if (t < -0.2) {
        weather.rain = 1;
        weather.snow = 0;
      } else if (t > 0.5) {
        weather.rain = 0;
        weather.snow = 1;
      } else {
        weather.rain = 0;
        weather.snow = 0;
      }
    }

    function currentTile(x, y) {
      return getTile(Math.floor(x), Math.floor(y));
    }

    function isSolidTile(tileId) {
      return TILE[tileId] && TILE[tileId].solid;
    }

    function collidesAt(x, y) {
      const left = Math.floor(x - player.w / 2);
      const right = Math.floor(x + player.w / 2);
      const top = Math.floor(y - player.h / 2);
      const bottom = Math.floor(y + player.h / 2);

      for (let yy = top; yy <= bottom; yy++) {
        for (let xx = left; xx <= right; xx++) {
          const id = getTile(xx, yy);
          if (isSolidTile(id)) {
            return true;
          }
        }
      }
      return false;
    }

    function movePlayer(dt) {
      const keys = input;
      let moveX = (keys['KeyD'] ? 1 : 0) - (keys['KeyA'] ? 1 : 0);
      let jump = keys['Space'] && player.onGround;

      if (Math.abs(moveX) > 0) player.dir = moveX > 0 ? 1 : -1;

      if (mode === 'creative') {
        player.speed = 7.2;
        const sprint = keys['ShiftLeft'] ? 1.7 : 1;
        if (keys['KeyW']) player.y -= 5.5 * dt;
        if (keys['KeyS']) player.y += 5.5 * dt;
        if (keys['KeyA']) player.x -= 6.5 * dt * sprint;
        if (keys['KeyD']) player.x += 6.5 * dt * sprint;
        if (keys['Space']) player.vy = 0;
        return;
      }

      const moveSpeed = player.speed * (keys['ShiftLeft'] ? 1.5 : 1);

      player.vx = moveX * moveSpeed;
      if (jump) {
        player.vy = -player.jump;
        player.onGround = false;
      }

      player.vy += settings.gravity * dt;
      player.x += player.vx * dt;
      player.y += player.vy * dt;

      // horizontal collision
      if (collidesAt(player.x, player.y)) {
        player.x -= player.vx * dt;
      }

      // vertical collision
      if (collidesAt(player.x, player.y)) {
        player.y -= player.vy * dt;
        if (player.vy > 0) player.onGround = true;
        player.vy = 0;
      } else {
        player.onGround = false;
      }

      // water / lava effects
      const tile = currentTile(player.x, player.y + 0.5);
      if (tile === 7) {
        player.hp = Math.max(0, player.hp - 4 * dt);
        if (food.value > 0) food.value = Math.max(0, food.value - 2 * dt);
      }
      if (tile === 28) {
        player.hp = Math.max(0, player.hp - 12 * dt);
      }

      player.x = clamp(player.x, 2, WORLD_COLS - 3);
      player.y = clamp(player.y, 1, WORLD_ROWS - 2);
    }

    function mineBlock(x, y) {
      const tx = Math.floor(x);
      const ty = Math.floor(y);
      const id = getTile(tx, ty);

      if (id === 0 || id === 20 || id === 22 || id === 7 || id === 28) return;

      if (mode === 'creative') {
        if (id !== 24) setTile(tx, ty, 0);
        return;
      }

      setTile(tx, ty, 0);
      const stackCap = stackFor(id);
      const existing = player.inventory[id] || 0;
      if (existing < stackCap) {
        player.inventory[id] = existing + 1;
      } else {
        addItem(id, 1);
      }

      // spawn particles
      for (let i=0;i<8;i++) particles.push({
        x: tx + 0.5 + (Math.random() - 0.5) * 0.5,
        y: ty + 0.5 + (Math.random() - 0.5) * 0.5,
        vx: (Math.random() - 0.5) * 0.8,
        vy: (Math.random() - 0.5) * 0.8,
        color: TILE[id].color,
        life: 1
      });
    }

    function placeBlockAt(tx, ty, itemId) {
      if (!itemId) return false;
      if (getTile(tx, ty) !== 0) return false;
      if (Math.abs(tx - player.x) < 1.3 && Math.abs(ty - player.y) < 1.6) return false;

      if (mode !== 'creative') {
        if ((player.inventory[itemId] || 0) <= 0) return false;
        player.inventory[itemId] -= 1;
        if (player.inventory[itemId] <= 0) delete player.inventory[itemId];
      }
      setTile(tx, ty, itemId);
      return true;
    }

    function getTargetBlock() {
      const px = Math.floor(player.x);
      const py = Math.floor(player.y);
      const dx = mouse.x - canvas.width / 2;
      const dy = mouse.y - canvas.height / 2;
      const dist = Math.hypot(dx, dy);

      // raycast in tile-space
      const range = 6;
      let best = null;
      for (let i = 0; i <= range * 2; i++) {
        const t = i / (range * 2);
        const tx = Math.floor(player.x + Math.sign(dx || 1) * t * range * 0.5);
        const ty = Math.floor(player.y + Math.sign(dy || 1) * t * range * 0.5);
        const id = getTile(tx, ty);
        if (id !== 0 && isSolidTile(id)) {
          best = {x: tx, y: ty, id};
          break;
        }
      }
      return best;
    }

    const input = {};
    const mouse = {x: canvas.width / 2, y: canvas.height / 2, down:false, right:false};

    window.addEventListener('keydown', (e) => {
      input[e.code] = true;
      if (e.code === 'KeyE') toggleInventory();
      if (e.code === 'Digit1') player.selected = 0;
      if (e.code === 'Digit2') player.selected = 1;
      if (e.code === 'Digit3') player.selected = 2;
      if (e.code === 'Digit4') player.selected = 3;
      if (e.code === 'Digit5') player.selected = 4;
      if (e.code === 'Digit6') player.selected = 5;
      if (e.code === 'Digit7') player.selected = 6;
      if (e.code === 'Digit8') player.selected = 7;
      if (e.code === 'Digit9') player.selected = 8;
      if (e.code === 'KeyQ') {
        if (player.hotbar.length > 1) {
          const item = player.hotbar[player.selected];
          player.hotbar.splice(player.selected, 1);
          player.hotbar.push(item);
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      input[e.code] = false;
    });

    window.addEventListener('mousedown', (e) => {
      if (player.inMenu) return;
      if (e.button === 0) mouse.down = true;
      if (e.button === 2) mouse.right = true;
    });

    window.addEventListener('mouseup', (e) => {
      if (e.button === 0) mouse.down = false;
      if (e.button === 2) mouse.right = false;
    });

    window.addEventListener('contextmenu', (e) => e.preventDefault());

    window.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
    });

    function toggleInventory() {
      player.inventoryOpen = !player.inventoryOpen;
      inventoryPanel.classList.toggle('open', player.inventoryOpen);
      drawInventory();
    }

    function createRecipeList() {
      recipeList.innerHTML = '';
      RECIPES.forEach((r) => {
        const row = document.createElement('div');
        row.className = 'recipe';

        const desc = document.createElement('div');
        const inputText = Object.entries(r.input).map(([key, amount]) => `${amount}x ${TILE[Number(key)].name}`).join(' + ');
        const outputText = Object.entries(r.output).map(([key, amount]) => `${amount}x ${TILE[Number(key)].name}`).join(' + ');
        desc.innerHTML = `<div><strong>${r.name}</strong></div><div style="opacity:.75;font-size:11px">${inputText} → ${outputText}</div>`;

        const button = document.createElement('button');
        button.textContent = 'Craft';
        button.onclick = () => craftRecipe(r);

        row.appendChild(desc);
        row.appendChild(button);
        recipeList.appendChild(row);
      });
    }

    function craftRecipe(recipe) {
      const inputEntries = Object.entries(recipe.input);
      for (const [id, needed] of inputEntries) {
        if ((player.inventory[Number(id)] || 0) < needed) {
          showMessage('Not enough materials');
          return;
        }
      }
      for (const [id, needed] of inputEntries) {
        player.inventory[Number(id)] -= needed;
        if (player.inventory[Number(id)] <= 0) delete player.inventory[Number(id)];
      }
      for (const [id, amount] of Object.entries(recipe.output)) {
        const itemId = Number(id);
        const current = player.inventory[itemId] || 0;
        player.inventory[itemId] = current + amount;
        if (player.hotbar.length < 9 && !player.hotbar.includes(itemId)) {
          player.hotbar.push(itemId);
        }
      }
      drawInventory();
      showMessage(`Crafted ${recipe.name}`);
    }

    function drawInventory() {
      inventoryGrid.innerHTML = '';
      const items = Object.entries(player.inventory).sort((a,b) => Number(a[0]) - Number(b[0]));
      const allItems = [];
      for (let i=0;i<20;i++) allItems.push(items[i] || null);

      allItems.forEach(([id, count], idx) => {
        const cell = document.createElement('div');
        cell.className = 'invItem' + (id ? '' : ' empty');
        if (id) {
          const itemId = Number(id);
          cell.innerHTML = `<div class="emoji">${TILE[itemId].emoji || '?'}</div><div>${TILE[itemId].name}</div><div class="num">${count}</div>`;
          cell.onclick = () => {
            if (!player.hotbar.includes(itemId)) {
              if (player.hotbar.length < 9) {
                player.hotbar.push(itemId);
              } else {
                player.hotbar[player.selected] = itemId;
              }
            }
            player.selected = player.hotbar.indexOf(itemId);
            if (player.selected < 0) player.selected = 0;
            inventoryPanel.classList.remove('open');
            player.inventoryOpen = false;
          };
        } else {
          cell.innerHTML = '<div style="font-size:20px">+</div>';
        }
        inventoryGrid.appendChild(cell);
      });
    }

    function renderHotbar() {
      hotbarEl.innerHTML = '';
      for (let i=0;i<9;i++) {
        const itemId = player.hotbar[i] || 0;
        const div = document.createElement('div');
        div.className = 'slot' + (i===player.selected ? ' selected' : '') + (!itemId ? ' empty' : '');
        div.innerHTML = itemId ?
          `<div class="icon">${TILE[itemId].emoji || '?'}</div><div class="count">${Math.max(1, player.inventory[itemId] || 1)}</div>` :
          `<div class="icon">—</div>`;
        div.addEventListener('click', () => player.selected = i);
        hotbarEl.appendChild(div);
      }
    }

    function updateHUD() {
      hpText.textContent = `${Math.max(0, Math.ceil(player.hp))} HP`;
      foodText.textContent = `${Math.ceil(food.value)}`;
      const daytime = time % 1 < 0.5 ? 'Day' : 'Night';
      timeText.textContent = daytime;
      modeText.textContent = `Mode: ${mode.toUpperCase()}`;
    }

    function checkMobs() {
      if (mode === 'creative') return;

      for (let i = mobs.length - 1; i >= 0; i--) {
        let m = mobs[i];
        const dx = player.x - m.x;
        const dy = player.y - m.y;
        const dist = Math.hypot(dx, dy);

        if (dist < 0.8) {
          player.hp -= 7 * dt;
          if (player.hp <= 0) {
            if (mode === 'hardcore') {
              localStorage.removeItem('blockworld2save');
              showMessage('You died. Hardcore world reset.');
              generateWorld(); createMobs(); makeInitialInventory(); mode = 'survival';
            } else {
              player.hp = player.maxHp;
              player.x = WORLD_COLS / 2;
              player.y = 8;
            }
          }
        }

        if (dist < 12) {
          const dirX = dx / (dist || 1);
          const dirY = dy / (dist || 1);
          m.x += dirX * m.speed * dt * 1.2;
          m.y += dirY * m.speed * dt * 0.9;
        } else {
          m.x += m.dir * 0.75 * dt;
          if (Math.random() < 0.02) m.dir *= -1;
        }

        // keep in bounds
        if (m.x < 2 || m.x > WORLD_COLS - 3) m.dir *= -1;

        // basic collision and gravity for mobs
        m.vy += 10 * dt;
        m.y += m.vy * dt;
        if (getTile(Math.floor(m.x), Math.floor(m.y + 1.4)) !== 0) {
          m.vy = 0;
        }
      }
    }

    function takeDamageFromMob() {
      // placeholder, but we handle in main loop.
    }

    function attackNearest() {
      if (player.inMenu) return;
      let best = null;
      let bestDist = 2.3;
      for (const m of mobs) {
        const dx = m.x - player.x;
        const dy = m.y - player.y;
        const dist = Math.hypot(dx, dy);
        if (dist < bestDist) {
          best = m;
          bestDist = dist;
        }
      }
      if (!best) return;
      best.hp -= 14 * (mode === 'creative' ? 3 : 1);
      if (best.hp <= 0) {
        mobs = mobs.filter(m => m !== best);
        addItem(17, 1);
        showMessage(`${best.type} defeated`);
      }
    }

    let lastTime = 0;
    let dt = 0;
    let pointerDown = false;

    function update(delta) {
      if (player.inMenu) return;
      time += delta * 0.018;
      updateWeather();

      const box = getTargetBlock();
      if (mouse.down && !player.inventoryOpen) {
        if (box) {
          mineBlock(box.x, box.y);
          pointerDown = true;
        }
      }
      if (mouse.right && !player.inventoryOpen) {
        const itemId = getSelectedItem();
        if (itemId) {
          const tx = Math.floor(player.x + (player.dir * 1.2));
          const ty = Math.floor(player.y);
          placeBlockAt(tx, ty, itemId);
        }
        mouse.right = false;
      }

      // left-click attack
      if (mouse.down && !player.inventoryOpen) {
        attackNearest();
      }

      movePlayer(delta);
      if (mode !== 'creative') {
        food.value = Math.max(0, food.value - delta * 0.8);
        if (food.value <= 0) {
          player.hp = Math.max(0, player.hp - 6 * delta);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= delta * 0.8;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // regenerate small health when standing on safe ground
      if (player.hp < player.maxHp && mode !== 'creative') {
        if (player.onGround && food.value > 20) {
          player.hp = Math.min(player.maxHp, player.hp + delta * 2.2);
        }
      }

      // weather effects
      if (weather.rain) {
        for (let i=0;i<2;i++) particles.push({
          x: Math.random() * WORLD_COLS,
          y: Math.random() * WORLD_ROWS,
          vx: -0.18,
          vy: 0.9 + Math.random() * 0.8,
          color: '#7cc9ff',
          life: 1.2
        });
      }
      if (weather.snow) {
        for (let i=0;i<2;i++) particles.push({
          x: Math.random() * WORLD_COLS,
          y: Math.random() * WORLD_ROWS,
          vx: -0.08,
          vy: 0.45 + Math.random() * 0.4,
          color: '#f1f7ff',
          life: 1.5
        });
      }

      // portal / special blocks logic
      const blockAtPlayer = getTile(Math.floor(player.x), Math.floor(player.y));
      if (blockAtPlayer === 20) {
        showMessage('Portal activated');
        if (mode !== 'creative') {
          player.hp = player.maxHp;
          food.value = food.max;
        }
      }

      // camera follows player
      camera.x = clamp(player.x, 8, WORLD_COLS - 8);
      camera.y = clamp(player.y, 8, WORLD_ROWS - 8);

      // keep world synced
      if (Math.random() < 0.02) saveGame();
      renderHotbar();
      updateHUD();
    }

    const camera = {x: WORLD_COLS / 2, y: WORLD_ROWS / 2};

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const vw = canvas.width / TILE_SIZE;
      const vh = canvas.height / TILE_SIZE;

      const startX = Math.floor(camera.x - vw / 2);
      const startY = Math.floor(camera.y - vh / 2);
      const endX = startX + Math.ceil(vw) + 2;
      const endY = startY + Math.ceil(vh) + 2;

      for (let y = startY; y < endY; y++) {
        for (let x = startX; x < endX; x++) {
          const id = getTile(x, y);
          if (!id) continue;
          const tile = TILE[id];
          if (!tile || !tile.color) continue;

          const px = (x - camera.x + vw / 2) * TILE_SIZE;
          const py = (y - camera.y + vh / 2) * TILE_SIZE;

          ctx.fillStyle = tile.color;
          ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);

          if (tile.type === 'liquid') {
            ctx.fillStyle = 'rgba(255,255,255,.18)';
            ctx.fillRect(px + 2, py + 2, TILE_SIZE - 4, TILE_SIZE - 4);
          }
          if (tile.type === 'light' || tile.type === 'portal') {
            ctx.fillStyle = 'rgba(255,255,255,.22)';
            ctx.fillRect(px + 3, py + 3, TILE_SIZE - 6, TILE_SIZE - 6);
          }
        }
      }

      // draw simple mobs
      for (const m of mobs) {
        const px = (m.x - camera.x + vw / 2) * TILE_SIZE;
        const py = (m.y - camera.y + vh / 2) * TILE_SIZE;
        ctx.fillStyle = m.color;
        ctx.fillRect(px - 8, py - 10, 16, 16);
        ctx.font = '12px sans-serif';
        ctx.fillText(m.emoji, px - 8, py - 12);
      }

      // draw player
      const px = (player.x - camera.x + vw / 2) * TILE_SIZE;
      const py = (player.y - camera.y + vh / 2) * TILE_SIZE;
      ctx.fillStyle = '#1b8ef5';
      ctx.fillRect(px - 9, py - 16, 18, 26);

      // particles
      for (const p of particles) {
        const sx = (p.x - camera.x + vw / 2) * TILE_SIZE;
        const sy = (p.y - camera.y + vh / 2) * TILE_SIZE;
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillRect(sx, sy, 3, 3);
        ctx.globalAlpha = 1;
      }

      // outline selected block
      const block = getTargetBlock();
      if (block) {
        const bx = (block.x - camera.x + vw / 2) * TILE_SIZE;
        const by = (block.y - camera.y + vh / 2) * TILE_SIZE;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(bx + 1, by + 1, TILE_SIZE - 2, TILE_SIZE - 2);
      }
    }

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function loop(ts) {
      const delta = Math.min(0.033, (ts - (loop.last || ts)) / 1000 || 0.016);
      loop.last = ts;

      if (!player.inMenu) {
        update(delta);
      }

      draw();
      requestAnimationFrame(loop);
    }

    function startGame() {
      const selectedMode = modeSelect.value;
      mode = selectedMode;
      generateWorld();
      createMobs();
      makeInitialInventory();
      if (mode === 'creative') {
        player.hotbar = [1,2,3,4,5,6,8,9,21];
      }
      player.inMenu = false;
      titleScreen.style.display = 'none';
      renderHotbar();
      updateHUD();
      saveGame();
    }

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('newWorldBtn').addEventListener('click', () => {
      worldSeed = Math.floor(Math.random() * 999999);
      generateWorld();
      createMobs();
      makeInitialInventory();
      player.inMenu = false;
      titleScreen.style.display = 'none';
      renderHotbar();
      updateHUD();
      showMessage('New world generated');
    });

    document.getElementById('closeInv').addEventListener('click', toggleInventory);

    // set default mode
    modeSelect.value = 'survival';
    createRecipeList();
    makeInitialInventory();
    worldSeed = 1;
    generateWorld();
    createMobs();
    renderHotbar();
    updateHUD();
    requestAnimationFrame(loop);

    // quick world loading if saved
    try {
      const saved = JSON.parse(localStorage.getItem('blockworld2save') || '{}');
      if (saved && saved.world) {
        // keep title screen but allow continue
        document.getElementById('startBtn').textContent = 'Continue';
      }
    } catch (_) {}
  </script>
</body>
</html>
