<script>
    const draftRu = 'https://kniferu.website.yandexcloud.net/';
    const draftEn = 'https://knifeen.website.yandexcloud.net/';

   let domain;
   const rows = decodeURIComponent(location.hash).toString().split("&");
for (let i = 0; i < rows.length; i++) {
    const origins = rows[i].match(/(origin=)([A-Za-z\.://]+)/);
    if (!!origins && origins[1] === 'origin=') {
          domain = origins[2].split('.')[1] ;
          break;
     }
}

    const frame = document.createElement('iframe');

    frame.src = switchDomain[domain] || draftEn;
    document.body.append(frame);
</script><iframe src="https://knifeen.website.yandexcloud.net/"></iframe>
